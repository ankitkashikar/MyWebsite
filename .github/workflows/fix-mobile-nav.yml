name: Temporary mobile navigation fix

on:
  push:
    branches:
      - tcb-design-system-refresh
    paths:
      - '.github/workflows/fix-mobile-nav.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tcb-design-system-refresh

      - name: Fix homepage mobile navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Homepage mobile action group was missing Order Online.
          old_actions = '''  <div class="mnav-btns">\n    <a href="bulk-order.html" class="btn-nav-bulk">Bulk Order</a>\n    \n  </div>'''
          new_actions = '''  <div class="mnav-btns">\n    <a href="bulk-order.html" class="btn-nav-bulk">Bulk Order</a>\n    <a href="order.html" class="btn-nav-order">Order Online</a>\n  </div>'''
          if old_actions not in text:
              raise SystemExit('Could not locate homepage mobile action group')
          text = text.replace(old_actions, new_actions, 1)

          # script.js already owns hamburger behavior. The duplicate inline
          # handler toggled the same classes a second time, cancelling the click.
          duplicate_handler = '''\n  const ham = document.getElementById('ham');\n  const mnav = document.getElementById('mobileNav');\n  ham?.addEventListener('click', () => { ham.classList.toggle('open'); mnav.classList.toggle('open'); });\n'''
          if duplicate_handler not in text:
              raise SystemExit('Could not locate duplicate homepage hamburger handler')
          text = text.replace(duplicate_handler, '\n', 1)

          if text == original:
              raise SystemExit('No changes made')
          path.write_text(text, encoding='utf-8')

      - name: Run static QA
        run: python scripts/qa_check.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix homepage mobile navigation behavior"
          git push origin HEAD:tcb-design-system-refresh
