name: Temporary Order Console Delivery Cost

on:
  push:
    branches: [tcb-design-system-refresh]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Separate customer and partner delivery costs in console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tcb-design-system-refresh
          fetch-depth: 0

      - name: Update internal delivery-cost fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('orders.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('for="deliveryFee">Delivery fee</label>', 'for="deliveryPartnerCost">Partner delivery cost</label>'),
              ('id="deliveryFee" type="number"', 'id="deliveryPartnerCost" type="number"'),
              ("deliveryFee: document.getElementById('deliveryFee')", "deliveryPartnerCost: document.getElementById('deliveryPartnerCost')"),
              ("els.deliveryFee.value = order.delivery_fee || '';", "els.deliveryPartnerCost.value = order.delivery_partner_cost ?? '';"),
              ("delivery_fee:els.deliveryFee.value === '' ? 0 : Number(els.deliveryFee.value),", "delivery_partner_cost:els.deliveryPartnerCost.value === '' ? 0 : Number(els.deliveryPartnerCost.value),"),
              ("order.delivery_booking_id ? `Booking: ${escapeHtml(order.delivery_booking_id)}` : '',", "order.delivery_booking_id ? `Booking: ${escapeHtml(order.delivery_booking_id)}` : '',\n        order.delivery_partner_cost !== null && order.delivery_partner_cost !== undefined ? `Partner cost: ${money(order.delivery_partner_cost)}` : '',"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected orders.html text not found: ' + old)
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run static QA
        run: python3 scripts/qa_check.py

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orders.html
          git commit -m "Separate customer and partner delivery costs in console"
          git push origin HEAD:tcb-design-system-refresh
