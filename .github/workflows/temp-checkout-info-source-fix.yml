name: One-time checkout info source fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-checkout-info-source-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch checkout delivery note at source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          menu = Path('menu.html')
          text = menu.read_text(encoding='utf-8')

          old_css = '.checkout-service-note{margin:7px 0 0;color:#777;font-size:.72rem;line-height:1.55}'
          extra_css = '.checkout-service-note{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.checkout-info-wrap{position:relative;display:inline-flex;align-items:center;flex:0 0 auto}.checkout-info-button{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(119,119,119,.75);border-radius:50%;background:transparent;color:#777;font:700 11px/1 var(--fb);cursor:help;padding:0;transition:border-color .15s ease,color .15s ease,background .15s ease}.checkout-info-button:hover,.checkout-info-button:focus-visible{border-color:var(--red);color:var(--red);background:rgba(192,57,43,.06);outline:none}.checkout-info-tooltip{position:absolute;left:50%;bottom:calc(100% + 9px);width:min(290px,calc(100vw - 48px));padding:10px 12px;border-radius:10px;background:#222;color:#f4f4f4;box-shadow:0 8px 24px rgba(0,0,0,.24);font:500 .72rem/1.5 var(--fb);letter-spacing:0;text-align:left;opacity:0;visibility:hidden;transform:translate(-50%,4px);pointer-events:none;z-index:20;transition:opacity .15s ease,transform .15s ease,visibility .15s ease}.checkout-info-tooltip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#222}.checkout-info-wrap:hover .checkout-info-tooltip,.checkout-info-wrap:focus-within .checkout-info-tooltip{opacity:1;visibility:visible;transform:translate(-50%,0)}'
          old_note = '<p class="checkout-service-note">Direct delivery is currently for serviceable addresses in PIN 411057. Estimated delivery is 35–50 minutes; traffic, rain, peak demand and delivery-partner availability can increase the ETA.</p>'
          new_note = '<p class="checkout-service-note"><span>Direct delivery is currently for serviceable addresses in PIN 411057.</span><span class="checkout-info-wrap"><button type="button" class="checkout-info-button" aria-label="Delivery estimate information" aria-describedby="checkout-delivery-info">i</button><span class="checkout-info-tooltip" id="checkout-delivery-info" role="tooltip">Estimated delivery is 35–50 minutes. Traffic, rain, peak demand and delivery-partner availability can increase the ETA.</span></span></p>'

          if text.count(old_css) != 1:
              raise SystemExit(f'Expected one checkout-service-note CSS rule, found {text.count(old_css)}')
          if text.count(old_note) != 1:
              raise SystemExit(f'Expected one old delivery note, found {text.count(old_note)}')

          text = text.replace(old_css, old_css + '\n    ' + extra_css, 1)
          text = text.replace(old_note, new_note, 1)
          menu.write_text(text, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          old_guard = "  if (serviceNote) {\n    const tooltipId = 'checkout-delivery-info';"
          new_guard = "  if (serviceNote && !serviceNote.querySelector('.checkout-info-wrap')) {\n    const tooltipId = 'checkout-delivery-info';"
          if js.count(old_guard) != 1:
              raise SystemExit(f'Expected one tooltip JS guard, found {js.count(old_guard)}')
          js = js.replace(old_guard, new_guard, 1)
          script.write_text(js, encoding='utf-8')

          if 'Estimated delivery is 35–50 minutes; traffic' in text:
              raise SystemExit('Old semicolon sentence still exists in menu.html')
          if text.count('class="checkout-info-button"') != 1:
              raise SystemExit('Static info button was not written exactly once')
          PY

      - name: Run static QA
        run: python3 scripts/qa_check.py

      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-checkout-info-source-fix.yml
          git config user.name "Ankit"
          git config user.email "ankit.kashikar@gmail.com"
          git add -A
          git commit -m "Fix checkout delivery info tooltip at source"
          git push origin main
