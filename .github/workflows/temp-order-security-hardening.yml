          Path('supabase/migrations/20260917_security_hardening.sql').write_text(r'''-- The Chinese Bliss — production security hardening
-- Apply after the base schema/order operations migration.
-- The browser must never be able to directly read/write sensitive tables.

begin;

-- Deny direct browser access to all operational/customer data. Edge Functions
-- use the service_role and remain the only trusted application writers/readers.
do $$
declare
  t text;
begin
  foreach t in array array[
    'customers','products','normal_orders','normal_order_items',
    'bulk_orders','bulk_order_items','order_status_events'
  ] loop
    if to_regclass('public.' || t) is not null then
      execute format('alter table public.%I enable row level security', t);
      execute format('alter table public.%I force row level security', t);
      execute format('revoke all privileges on table public.%I from anon, authenticated', t);
    end if;
  end loop;
end $$;

-- Private rate-limit state. Raw IPs are never stored; Edge Functions send a
-- SHA-256 key derived from endpoint + client address.
create table if not exists public.security_rate_limits (
  key text primary key,
  window_started_at timestamptz not null default now(),
  request_count integer not null default 0 check (request_count >= 0),
  updated_at timestamptz not null default now()
);

alter table public.security_rate_limits enable row level security;
alter table public.security_rate_limits force row level security;
revoke all privileges on table public.security_rate_limits from anon, authenticated;

create or replace function public.consume_security_rate_limit(
  p_key text,
  p_limit integer,
  p_window_seconds integer
) returns boolean
language plpgsql
security definer
set search_path = public
as $$
declare
  v_now timestamptz := clock_timestamp();
  v_count integer;
  v_started timestamptz;
begin
  if p_key is null or length(p_key) < 16 or p_limit < 1 or p_window_seconds < 1 then
    return false;
  end if;

  insert into public.security_rate_limits(key, window_started_at, request_count, updated_at)
  values (p_key, v_now, 1, v_now)
  on conflict (key) do update set
    window_started_at = case
      when public.security_rate_limits.window_started_at <= v_now - make_interval(secs => p_window_seconds)
      then v_now else public.security_rate_limits.window_started_at end,
    request_count = case
      when public.security_rate_limits.window_started_at <= v_now - make_interval(secs => p_window_seconds)
      then 1 else public.security_rate_limits.request_count + 1 end,
    updated_at = v_now
  returning request_count, window_started_at into v_count, v_started;

  return v_count <= p_limit;
end;
$$;

revoke all on function public.consume_security_rate_limit(text, integer, integer) from public, anon, authenticated;
grant execute on function public.consume_security_rate_limit(text, integer, integer) to service_role;

-- Database-side invariants: browser/API tampering cannot create unsupported
-- lifecycle/payment values even if an application bug is introduced later.
do $$
begin
  if to_regclass('public.normal_orders') is not null and not exists (
    select 1 from pg_constraint where conname = 'normal_orders_payment_status_check'
  ) then
    alter table public.normal_orders add constraint normal_orders_payment_status_check
      check (payment_status in ('pending','paid','failed','refund_pending','refunded','partially_refunded'));
  end if;
  if to_regclass('public.bulk_orders') is not null and not exists (
    select 1 from pg_constraint where conname = 'bulk_orders_payment_status_check'
  ) then
    alter table public.bulk_orders add constraint bulk_orders_payment_status_check
      check (payment_status in ('pending','paid','failed','refund_pending','refunded','partially_refunded'));
  end if;
end $$;

create index if not exists security_rate_limits_updated_idx
  on public.security_rate_limits(updated_at);

commit;
''')

          # ---------- permanent security QA ----------
          Path('scripts/security_qa.py').write_text(r'''#!/usr/bin/env python3
from pathlib import Path
import re, sys

ROOT = Path(__file__).resolve().parents[1]
errors = []
functions = [
    ROOT/'supabase/functions/place-order/index.ts',
    ROOT/'supabase/functions/admin-orders/index.ts',
    ROOT/'supabase/functions/order-status/index.ts',
]

for path in functions:
    text = path.read_text(encoding='utf-8')
    if 'Access-Control-Allow-Origin": "*"' in text:
        errors.append(f'{path}: wildcard CORS is not allowed')
    if 'SUPABASE_SERVICE_ROLE_KEY' not in text:
        errors.append(f'{path}: expected server-side service-role usage missing')
    if 'Cache-Control' not in text or 'no-store' not in text:
        errors.append(f'{path}: sensitive API responses must be no-store')

repo_text = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in ROOT.rglob('*') if p.is_file() and '.git' not in p.parts)
secret_patterns = [
    r'sb_secret_[A-Za-z0-9_-]{16,}',
    r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}',
]
for pat in secret_patterns:
    if re.search(pat, repo_text):
        errors.append('Repository appears to contain a secret/service credential pattern')

admin = (ROOT/'supabase/functions/admin-orders/index.ts').read_text()
if 'TCB_ADMIN_EMAIL' not in admin or 'email !== adminEmail' not in admin:
    errors.append('admin-orders must enforce the single TCB admin email server-side')

migration = (ROOT/'supabase/migrations/20260917_security_hardening.sql').read_text()
for token in ['enable row level security', 'revoke all privileges', 'consume_security_rate_limit']:
    if token not in migration.lower():
        errors.append(f'security migration missing: {token}')

orders = (ROOT/'orders.html').read_text()
if 'noindex,nofollow,noarchive,nosnippet' not in orders:
    errors.append('orders.html must remain excluded from indexing')

if errors:
    print('SECURITY QA FAILED')
    for e in errors: print(' -', e)
    sys.exit(1)
print('SECURITY QA PASS')
''')

