name: Step 2 Predeploy Security QA

on:
  push:
    branches:
      - tcb-security-step2-edge-functions
    paths:
      - 'supabase/functions/admin-orders/index.ts'
      - 'supabase/functions/order-status/index.ts'
      - 'supabase/functions/place-order/index.ts'
      - 'supabase/config.toml'
      - 'supabase-config.js'
      - 'orders.html'
      - 'scripts/security_step1a_qa.py'
      - 'scripts/security_step2_admin_orders_qa.py'
      - 'scripts/security_step2_order_status_qa.py'
      - 'scripts/security_step2_predeploy_qa.py'
      - '.github/workflows/security-step2-predeploy-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predeploy-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Step 1 public-order regression
        run: python scripts/security_step1a_qa.py
      - name: Run admin-orders security regression
        run: python scripts/security_step2_admin_orders_qa.py
      - name: Run order-status security regression
        run: python scripts/security_step2_order_status_qa.py
      - name: Run combined Step 2 predeploy checks
        run: python scripts/security_step2_predeploy_qa.py
