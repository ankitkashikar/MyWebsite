name: Apply mandatory TCB Order Console MFA

on:
  push:
    branches:
      - tcb-order-console-security-2026-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tcb-order-console-security-2026-final
          fetch-depth: 0

      - name: Apply MFA patch
        run: python3 scripts/apply_mfa_patch.py

      - name: Remove one-time patch files
        run: rm .github/workflows/temp-mfa-order-console.yml scripts/apply_mfa_patch.py

      - name: Commit changes
        run: |
          git config user.name "TCB QA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Require MFA for TCB Order Console"
          git push origin HEAD:tcb-order-console-security-2026-final
