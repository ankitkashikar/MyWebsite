name: TCB Security QA

on:
  push:
    branches:
      - main
      - tcb-order-console-security-2026-final
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Order-system security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run TCB security QA
        run: python scripts/security_qa.py
