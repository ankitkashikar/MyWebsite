name: TCB Security QA

on:
  push:
    branches: [main, tcb-design-system-refresh]
  pull_request:

permissions:
  contents: read

jobs:
  security-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run security checks
        run: python scripts/security_qa.py
